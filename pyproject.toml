[project]
name = "langgraph-expts"
version = "0.1.0"
description = "LangGraph experiments in a src-based Python project"
readme = "README.md"
authors = [
    { name = "someshfengde", email = "someshfengde@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.2.0",
    "langchain>=1.2.10",
    "langchain-openai>=1.1.10",
    "langgraph>=1.0.9",
    "python-dotenv>=1.2.2",
]

[project.scripts]
langgraph-expts = "langgraph_expts:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
